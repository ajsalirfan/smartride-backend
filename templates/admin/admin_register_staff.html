<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register New Staff | SmartRide Admin</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* 🌌 Background + Floating Lights */
    body {
      background: radial-gradient(circle at top left, #0f172a, #1e293b, #0f172a);
      color: #e5e7eb;
      font-family: "Poppins", sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.8;
      z-index: 0;
    }

    body::before {
      width: 600px;
      height: 600px;
      top: -200px;
      left: -200px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
      animation: floatGlow 6s ease-in-out infinite alternate;
    }

    body::after {
      width: 400px;
      height: 400px;
      bottom: -100px;
      right: -150px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
      animation: floatGlow 8s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      0% {
        transform: scale(1) translate(0, 0);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.1) translate(30px, 30px);
        opacity: 1;
      }
    }

    /* 💎 Glass Card */
    .glass-card {
      position: relative;
      width: 400px;
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.3rem;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      padding: 2.2rem;
      z-index: 10;
    }

    .card-header {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #10b981;
      letter-spacing: 0.5px;
    }

    /* ✍️ Form Fields */
    .form-label {
      font-weight: 500;
      color: #d1d5db;
    }

    .form-control {
      background: rgba(17, 24, 39, 0.55);
      border: 1px solid rgba(75, 85, 99, 0.5);
      color: #e5e7eb;
      border-radius: 0.6rem;
      transition: all 0.3s ease;
    }

    .form-control::placeholder {
      color: rgba(229, 231, 235, 0.55);
    }

    .form-control:focus {
      border-color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      background: rgba(17, 24, 39, 0.8);
      color: #ffffff;
      animation: pulseGlow 1.2s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
      }
      100% {
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.7);
      }
    }

    /* 🚀 Button */
    .btn-submit {
      background: linear-gradient(90deg, #10b981, #06b6d4);
      color: white;
      font-weight: 500;
      border: none;
      border-radius: 0.7rem;
      width: 100%;
      padding: 10px;
      transition: all 0.35s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(90deg, #059669, #0284c7);
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.45);
    }

    /* 🪄 Alerts */
    .alert {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 0.6rem;
      color: #a7f3d0;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    /* ⚙️ Footer */
    .footer-note {
      text-align: center;
      margin-top: 10px;
      font-size: 0.8rem;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div class="glass-card">
    <div class="card-header">👷 Register New Staff</div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          class="form-control"
          placeholder="Enter staff name"
          required
        />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email ID</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="Enter email"
          required
        />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Temporary Password</label>
        <input
          type="text"
          id="password"
          name="password"
          class="form-control"
          placeholder="Enter password"
          required
        />
      </div>
      <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <input
          type="text"
          id="role"
          name="role"
          class="form-control"
          placeholder="e.g. Field Agent, Technician"
        />
      </div>
      <button type="submit" class="btn btn-submit mt-3">
        Register Staff
      </button>
    </form>

    <p class="footer-note">SmartRide Admin Portal © 2025</p>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
